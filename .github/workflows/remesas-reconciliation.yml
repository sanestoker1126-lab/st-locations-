name: ST Locations · Reconciliación de fuentes (solo staging)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/remesas_reconcile.py'
      - 'tools/remesas_reconcile_ci.py'
      - 'tools/remesas_repo_crosswalk.py'
      - 'tools/remesas_sync_drive.py'
      - 'tests/test_remesas_reconcile.py'
      - 'tests/test_remesas_repo_crosswalk.py'
      - '.github/workflows/remesas-reconciliation.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: remesas-reconciliation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias opcionales de Google Sheets
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Sincronizar Google Drive (lectura; snapshot efímero)
        env:
          ST_LOCATIONS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ST_LOCATIONS_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/remesas_sync_drive.py --input-dir data/staging/remesas_sources
      - name: Ejecutar pruebas de identidad, cruces y no publicación
        run: |
          python -m unittest discover -s tests -p 'test_remesas_*.py' -v
      - name: Conciliar contra el catálogo vigente (sin modificarlo)
        id: reconciliation
        run: python tools/remesas_reconcile_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-reconciliacion
          path: |
            /tmp/st-locations-reconciliation/estado_operacion.json
            data/staging/reconciliation_report.json
          retention-days: 30
      - name: PR solo de métricas agregadas (nunca contactos ni CSV de origen)
        if: steps.reconciliation.outputs.has_sources == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/remesas-staging
          base: main
          title: 'ST Locations · cambios de fuentes para revisión'
          commit-message: 'chore(remesas): métricas agregadas de conciliación; sin datos personales'
          body: |
            Conciliación automática **solo de staging**. El PR contiene métricas agregadas.
            **No incluye teléfonos, propietarios ni direcciones de candidatos**.
            No modifica `data/locations.json`, `data/master-contacts.json` ni la web.
            Se requiere verificación humana de negocios, operadores y teléfonos antes de publicar.
          add-paths: |
            data/staging/reconciliation_report.json
          delete-branch: true